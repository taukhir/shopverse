<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" role="img" aria-labelledby="title desc">
  <title id="title">JVM memory and Java Memory Model complete reference poster</title>
  <desc id="desc">Twelve-panel reference covering JVM runtime areas, data placement, stack frames, ThreadLocal, TLAB, CPU caches, the Java Memory Model, volatile, happens-before, locks, atomics, collections, memory leaks, and out-of-memory sources.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .page{fill:url(#page)}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.shared{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.thread{fill:#eff6ff;stroke:#2563eb;stroke-width:1.6}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.6}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:1.6}.danger{fill:#fff1f2;stroke:#e11d48;stroke-width:1.6}.bar{fill:#0f2a55}.bar2{fill:#312e81}.bar3{fill:#92400e}.bar4{fill:#14532d}.title{font:800 34px system-ui;fill:#0f172a}.head{font:700 19px system-ui;fill:#fff}.sub{font:700 17px system-ui;fill:#0f172a}.txt{font:14px system-ui;fill:#1e293b}.small{font:12.5px system-ui;fill:#334155}.mono{font:13px ui-monospace,Consolas,monospace;fill:#172554}.good{font:700 13px system-ui;fill:#166534}.bad{font:700 13px system-ui;fill:#be123c}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.footer{font:800 24px system-ui;fill:#fff;letter-spacing:.7px}
    </style>
  </defs>
  <rect class="page" width="1920" height="1400"/><text class="title" x="960" y="48" text-anchor="middle">JVM MEMORY + JAVA MEMORY MODEL — COMPLETE REFERENCE</text>

  <!-- 1: runtime areas -->
  <rect class="panel" x="20" y="70" width="455" height="450" rx="14"/><path class="bar" d="M34 70H461Q475 70 475 84V112H20V84Q20 70 34 70Z"/><text class="head" x="247" y="98" text-anchor="middle">1 · JVM RUNTIME AREAS</text>
  <rect class="shared" x="38" y="130" width="200" height="168" rx="10"/><text class="sub" x="55" y="157">Shared</text><text class="txt" x="55" y="184">• Heap: objects and arrays</text><text class="txt" x="55" y="209">• Collections + backing storage</text><text class="txt" x="55" y="234">• Enum and String objects</text><text class="txt" x="55" y="259">• Static/class-associated state</text><text class="txt" x="55" y="284">• Method area / metaspace</text>
  <rect class="thread" x="255" y="130" width="202" height="168" rx="10"/><text class="sub" x="272" y="157">Per JVM thread</text><text class="txt" x="272" y="184">• Java stack</text><text class="txt" x="272" y="209">• Stack frames</text><text class="txt" x="272" y="234">• PC register</text><text class="txt" x="272" y="259">• Native method stack</text><text class="small" x="272" y="284">Exact native layout varies.</text>
  <rect class="amber" x="38" y="316" width="419" height="182" rx="10"/><text class="sub" x="55" y="345">Outside Java heap (-Xmx)</text><text class="txt" x="55" y="373">• Metaspace / compressed class space</text><text class="txt" x="55" y="398">• JIT code cache</text><text class="txt" x="55" y="423">• Thread stacks · direct buffers · mmap</text><text class="txt" x="55" y="448">• GC/JIT structures · JNI · agents</text><text class="bad" x="55" y="478">Container memory must budget all of these.</text>

  <!-- 2: where data lives -->
  <rect class="panel" x="490" y="70" width="455" height="450" rx="14"/><path class="bar" d="M504 70H931Q945 70 945 84V112H490V84Q490 70 504 70Z"/><text class="head" x="717" y="98" text-anchor="middle">2 · WHERE DATA LIVES</text>
  <text class="sub" x="510" y="142">Concept</text><text class="sub" x="710" y="142">Logical location</text>
  <path d="M510 154H925" stroke="#cbd5e1"/><g class="txt"><text x="510" y="180">Object / array</text><text x="710" y="180">heap</text><text x="510" y="208">Instance field</text><text x="710" y="208">inside heap object</text><text x="510" y="236">Local primitive</text><text x="710" y="236">frame local slot*</text><text x="510" y="264">Local object variable</text><text x="710" y="264">frame reference → heap</text><text x="510" y="292">Collection</text><text x="710" y="292">object + array/nodes on heap</text><text x="510" y="320">Static field</text><text x="710" y="320">loaded-class state; shared</text><text x="510" y="348">Enum constant</text><text x="710" y="348">singleton heap object</text><text x="510" y="376">Interned String</text><text x="710" y="376">pooled reference → heap object</text><text x="510" y="404">Atomic / lock</text><text x="710" y="404">ordinary shared object + JMM effects</text><text x="510" y="432">Direct buffer payload</text><text x="710" y="432">native memory</text></g><text class="small" x="510" y="472">*JIT may keep, eliminate, or scalar-replace values. Do not depend on addresses.</text>

  <!-- 3: stack frame -->
  <rect class="panel" x="960" y="70" width="455" height="450" rx="14"/><path class="bar" d="M974 70H1401Q1415 70 1415 84V112H960V84Q960 70 974 70Z"/><text class="head" x="1187" y="98" text-anchor="middle">3 · STACK FRAME (PER CALL)</text>
  <rect class="thread" x="1010" y="138" width="310" height="76" rx="9"/><text class="sub" x="1030" y="166">Local-variable array</text><text class="small" x="1030" y="191">this · parameters · primitives · references</text>
  <path class="arrow" d="M1165 214V246"/><rect class="thread" x="1010" y="246" width="310" height="76" rx="9"/><text class="sub" x="1030" y="274">Operand stack</text><text class="small" x="1030" y="299">intermediate operands and results</text>
  <path class="arrow" d="M1165 322V354"/><rect class="violet" x="1010" y="354" width="310" height="110" rx="9"/><text class="sub" x="1030" y="382">Frame data</text><text class="txt" x="1030" y="408">• return address / result</text><text class="txt" x="1030" y="433">• constant-pool link · exception data</text><text class="small" x="1030" y="455">Frame pops on return or abrupt completion.</text>
  <text class="txt" x="1340" y="160">top</text><path class="arrow" d="M1360 445V180"/><text class="small" x="1335" y="480">one Java stack</text><text class="small" x="1335" y="498">per JVM thread</text>

  <!-- 4: ThreadLocal + TLAB -->
  <rect class="panel" x="1430" y="70" width="470" height="450" rx="14"/><path class="bar2" d="M1444 70H1886Q1900 70 1900 84V112H1430V84Q1430 70 1444 70Z"/><text class="head" x="1665" y="98" text-anchor="middle">4 · THREADLOCAL + TLAB</text>
  <text class="sub" x="1450" y="142">ThreadLocal storage</text><rect class="thread" x="1450" y="160" width="95" height="62" rx="8"/><text class="txt" x="1472" y="196">Thread</text><path class="arrow" d="M1545 191H1590"/><rect class="violet" x="1590" y="160" width="135" height="62" rx="8"/><text class="txt" x="1608" y="186">ThreadLocalMap</text><text class="small" x="1618" y="207">heap object</text><path class="arrow" d="M1725 191H1770"/><rect class="shared" x="1770" y="150" width="105" height="82" rx="8"/><text class="small" x="1783" y="178">weak key</text><text class="small" x="1783" y="199">strong value</text><text class="small" x="1783" y="220">heap object</text>
  <text class="bad" x="1450" y="258">Pooled thread → map → stale value can leak.</text><text class="good" x="1450" y="282">Use set → try/finally → remove.</text>
  <path d="M1450 304H1880" stroke="#cbd5e1"/><text class="sub" x="1450" y="336">TLAB: Thread Local Allocation Buffer</text><rect class="amber" x="1450" y="355" width="425" height="78" rx="9"/><text class="txt" x="1470" y="383">Per-thread allocation reservation inside the shared heap.</text><text class="txt" x="1470" y="409">Fast allocation; object can later escape and be shared.</text><text class="bad" x="1450" y="463">TLAB ≠ ThreadLocal ≠ CPU cache.</text><text class="small" x="1450" y="491">“Thread-local” describes allocation ownership, not a new memory area.</text>

  <!-- 5: JMM -->
  <rect class="panel" x="20" y="535" width="610" height="385" rx="14"/><path class="bar2" d="M34 535H616Q630 535 630 549V577H20V549Q20 535 34 535Z"/><text class="head" x="325" y="563" text-anchor="middle">5 · JAVA MEMORY MODEL (JMM)</text>
  <rect class="thread" x="45" y="610" width="150" height="102" rx="10"/><text class="sub" x="82" y="640">Thread A</text><text class="small" x="65" y="668">execution state</text><text class="small" x="62" y="692">register/cache possible</text><rect class="shared" x="230" y="610" width="190" height="102" rx="10"/><text class="sub" x="260" y="640">Shared variables</text><text class="small" x="253" y="668">heap / class state</text><text class="small" x="255" y="692">abstract JMM actions</text><rect class="thread" x="455" y="610" width="150" height="102" rx="10"/><text class="sub" x="492" y="640">Thread B</text><text class="small" x="475" y="668">execution state</text><text class="small" x="472" y="692">register/cache possible</text><path class="arrow" d="M195 650H230"/><path class="arrow" d="M420 675H455"/>
  <text class="sub" x="45" y="752">The JMM defines</text><text class="txt" x="45" y="780">• visibility: which write a read may observe</text><text class="txt" x="45" y="805">• ordering: actions constrained before other actions</text><text class="txt" x="45" y="830">• atomicity: indivisible operations</text><text class="bad" x="45" y="865">Working memory is abstract—not literally L1/L2/L3.</text><text class="small" x="45" y="893">Compilers, JITs, CPUs, caches, and RAM must preserve allowed behavior.</text>

  <!-- 6 volatile -->
  <rect class="panel" x="645" y="535" width="405" height="385" rx="14"/><path class="bar3" d="M659 535H1036Q1050 535 1050 549V577H645V549Q645 535 659 535Z"/><text class="head" x="847" y="563" text-anchor="middle">6 · VOLATILE</text>
  <rect class="amber" x="665" y="606" width="365" height="120" rx="10"/><text class="sub" x="685" y="636">Exact rule</text><text class="txt" x="685" y="663">A write to volatile v happens-before</text><text class="txt" x="685" y="687">a subsequent read of that same v.</text><text class="good" x="685" y="714">Visibility + ordering around the edge.</text>
  <text class="mono" x="675" y="760">data = 42;   // ordinary write</text><text class="mono" x="675" y="786">ready = true; // volatile write</text><text class="mono" x="675" y="822">if (ready) use(data); // later volatile read</text><text class="bad" x="675" y="856">volatile count++ is NOT atomic.</text><text class="small" x="675" y="882">No promise of RAM access, cache flush, fairness, or scheduling.</text>

  <!-- 7 happens before -->
  <rect class="panel" x="1065" y="535" width="405" height="385" rx="14"/><path class="bar2" d="M1079 535H1456Q1470 535 1470 549V577H1065V549Q1065 535 1079 535Z"/><text class="head" x="1267" y="563" text-anchor="middle">7 · HAPPENS-BEFORE</text>
  <g class="txt"><text x="1085" y="614">1. Program order within one thread</text><text x="1085" y="646">2. Monitor unlock → later lock of same monitor</text><text x="1085" y="678">3. Volatile write → subsequent read of same volatile</text><text x="1085" y="710">4. Actions before start() → started thread</text><text x="1085" y="742">5. Thread actions → successful join()/termination detection</text><text x="1085" y="774">6. API-specific executor, Future, queue guarantees</text><text x="1085" y="806">7. Transitivity: A→B and B→C implies A→C</text></g>
  <rect class="violet" x="1095" y="838" width="345" height="54" rx="9"/><text class="good" x="1115" y="861">Proof = program-order edges + one named</text><text class="good" x="1115" y="882">synchronization edge + transitivity.</text>

  <!-- 8 CPU hierarchy -->
  <rect class="panel" x="1485" y="535" width="415" height="385" rx="14"/><path class="bar4" d="M1499 535H1886Q1900 535 1900 549V577H1485V549Q1485 535 1499 535Z"/><text class="head" x="1692" y="563" text-anchor="middle">8 · CPU MEMORY HIERARCHY</text>
  <g><rect class="violet" x="1510" y="615" width="66" height="58" rx="8"/><text class="txt" x="1522" y="649">REG</text><rect class="thread" x="1600" y="615" width="66" height="58" rx="8"/><text class="txt" x="1620" y="649">L1</text><rect class="thread" x="1690" y="615" width="66" height="58" rx="8"/><text class="txt" x="1710" y="649">L2</text><rect class="shared" x="1780" y="615" width="66" height="58" rx="8"/><text class="txt" x="1800" y="649">L3</text><path class="arrow" d="M1576 644H1598"/><path class="arrow" d="M1666 644H1688"/><path class="arrow" d="M1756 644H1778"/></g>
  <path class="arrow" d="M1813 673V725"/><rect class="amber" x="1600" y="725" width="210" height="62" rx="9"/><text class="sub" x="1666" y="762">RAM</text><text class="small" x="1633" y="781">larger / slower</text>
  <text class="txt" x="1510" y="825">• Topology varies by CPU.</text><text class="txt" x="1510" y="850">• Cache coherence is not a Java proof.</text><text class="txt" x="1510" y="875">• JIT maps JMM rules to platform operations.</text><text class="bad" x="1510" y="900">Reason from happens-before, not cache stories.</text>

  <!-- 9 locks atomics -->
  <rect class="panel" x="20" y="935" width="455" height="375" rx="14"/><path class="bar" d="M34 935H461Q475 935 475 949V977H20V949Q20 935 34 935Z"/><text class="head" x="247" y="963" text-anchor="middle">9 · LOCKS + ATOMICS</text>
  <rect class="thread" x="40" y="1005" width="195" height="212" rx="10"/><text class="sub" x="60" y="1035">Mutual exclusion</text><text class="txt" x="60" y="1064">• synchronized</text><text class="txt" x="60" y="1089">• ReentrantLock</text><text class="txt" x="60" y="1114">• ReadWriteLock</text><text class="txt" x="60" y="1139">• StampedLock</text><text class="small" x="60" y="1174">Unlock → later lock</text><text class="small" x="60" y="1195">provides visibility/order.</text>
  <rect class="violet" x="255" y="1005" width="200" height="212" rx="10"/><text class="sub" x="275" y="1035">Single-variable atomic</text><text class="txt" x="275" y="1064">• AtomicInteger</text><text class="txt" x="275" y="1089">• AtomicReference</text><text class="txt" x="275" y="1114">• CAS loops</text><text class="txt" x="275" y="1139">• VarHandle modes</text><text class="txt" x="275" y="1164">• LongAdder*</text><text class="small" x="275" y="1195">*sum() is not a transactional snapshot.</text>
  <text class="bad" x="40" y="1252">Use one lock/owner for multi-field invariants.</text><text class="small" x="40" y="1282">Atomic fields do not create transactions across objects.</text>

  <!-- 10 collections -->
  <rect class="panel" x="490" y="935" width="455" height="375" rx="14"/><path class="bar4" d="M504 935H931Q945 935 945 949V977H490V949Q490 935 504 935Z"/><text class="head" x="717" y="963" text-anchor="middle">10 · COLLECTIONS + SHARED STATE</text>
  <text class="sub" x="515" y="1015">Memory shape</text><text class="txt" x="515" y="1044">• ArrayList → object + backing Object[]</text><text class="txt" x="515" y="1069">• HashMap → map + table + nodes/trees</text><text class="txt" x="515" y="1094">• enum constants and elements are objects</text><text class="txt" x="515" y="1119">• stack slots hold references, not object bodies</text>
  <rect class="shared" x="515" y="1140" width="405" height="112" rx="10"/><text class="sub" x="535" y="1170">Concurrency rule</text><text class="good" x="535" y="1197">Concurrent containers protect documented operations.</text><text class="bad" x="535" y="1224">They do not make arbitrary multi-call logic atomic.</text><text class="small" x="535" y="1245">Prefer compute/merge or protect the compound invariant.</text>
  <text class="small" x="515" y="1282">Thread-safe does not mean bounded: add size/TTL/lifecycle controls.</text>

  <!-- 11 safe publication -->
  <rect class="panel" x="960" y="935" width="455" height="375" rx="14"/><path class="bar2" d="M974 935H1401Q1415 935 1415 949V977H960V949Q960 935 974 935Z"/><text class="head" x="1187" y="963" text-anchor="middle">11 · SAFE PUBLICATION</text>
  <text class="txt" x="985" y="1015">Safe publication mechanisms:</text><text class="txt" x="985" y="1044">• class/static initialization</text><text class="txt" x="985" y="1069">• volatile reference</text><text class="txt" x="985" y="1094">• same lock for write and read</text><text class="txt" x="985" y="1119">• thread-safe queue/collection contract</text><text class="txt" x="985" y="1144">• thread start, executor submission, Future.get()</text><text class="txt" x="985" y="1169">• immutable object after completed construction</text>
  <rect class="violet" x="985" y="1192" width="405" height="82" rx="10"/><text class="good" x="1005" y="1221">final fields receive initialization safety when</text><text class="good" x="1005" y="1245">this does not escape during construction.</text><text class="small" x="1005" y="1266">final reference ≠ deeply immutable object graph.</text>

  <!-- 12 leaks -->
  <rect class="panel" x="1430" y="935" width="470" height="375" rx="14"/><path class="bar3" d="M1444 935H1886Q1900 935 1900 949V977H1430V949Q1430 935 1444 935Z"/><text class="head" x="1665" y="963" text-anchor="middle">12 · MEMORY LEAKS + OOM</text>
  <rect class="danger" x="1450" y="1003" width="430" height="92" rx="10"/><text class="mono" x="1470" y="1035">GC root → static cache / pooled Thread</text><text class="mono" x="1470" y="1061">→ collection / ThreadLocalMap → stale object</text><text class="bad" x="1470" y="1084">Leak = unwanted reachable graph.</text>
  <text class="txt" x="1450" y="1132">OOM / pressure source</text><text class="txt" x="1450" y="1160">• Java heap: retained graph or large allocation</text><text class="txt" x="1450" y="1185">• Metaspace: class-loader/generated-class growth</text><text class="txt" x="1450" y="1210">• Native/direct: buffers, mmap, JNI, VM structures</text><text class="txt" x="1450" y="1235">• Thread stacks: too many platform threads</text><text class="txt" x="1450" y="1260">• Container OOM: total RSS exceeds cgroup limit</text><text class="good" x="1450" y="1287">Compare live set after GC; inspect paths to GC roots.</text>

  <rect class="bar" x="20" y="1325" width="1880" height="55" rx="12"/><text class="footer" x="960" y="1361" text-anchor="middle">PROVE CONCURRENCY WITH HAPPENS-BEFORE — NOT TIMING OR CACHE STORIES</text>
</svg>

title = "ShopVerse gitleaks config"

# Keep every built-in detection rule; we only add an allowlist below.
[extend]
useDefault = true

[allowlist]
description = "Audited findings: burned/rotated keys, intentional test fixtures, and documentation examples with no real secret value"

# Exact commit:file:rule:line fingerprints, as printed by gitleaks itself.
# Each entry below is annotated with why it is safe to ignore.
fingerprints = [
  # Original leaked RSA signing key, already treated as burned per
  # commit 503fc9f5 (Stop committing auth-service JWT signing key to the
  # repo). The service was later renamed security-service -> auth-service;
  # nothing in production trusts this key. Rewriting history to remove it
  # was explicitly rejected (would force-push-break every clone/fork) and
  # is unnecessary since the key material is already rotated out of use.
  "8f154ec06f3afa6a054ea2a3760e710e4283bb44:security-service/src/main/resources/keys/private.pem:private-key:1",

  # Deliberately non-sensitive test-only key pair added by the same fix
  # (503fc9f5) specifically to replace the real key in
  # AuthServiceApplicationTests. Never used outside the test classpath.
  "503fc9f5d830a8e3f139eb31c9b250a0e8b14cb9:services/auth-service/src/test/resources/keys/private.pem:private-key:1",

  # Documentation example payloads, not real credentials: a placeholder
  # redacted-api-key header value and fabricated sv_live sample API key
  # used to illustrate the API-key design docs.

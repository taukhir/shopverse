<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Where ThreadLocal values are stored</title>
  <desc id="desc">A heap-resident worker Thread strongly references its ThreadLocalMap. Entries weakly reference ThreadLocal keys and strongly reference values, showing both isolation and stale-entry retention.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.thread{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.map{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.value{fill:#dcfce7;stroke:#15803d;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.h{font:700 22px system-ui;fill:#0f172a}.p{font:16px system-ui;fill:#334155}.small{font:14px system-ui;fill:#475569}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.weak{stroke-dasharray:8 6}</style></defs>
  <rect class="bg" width="1200" height="650"/><text class="h" x="40" y="45">ThreadLocal isolation is implemented by heap references</text>
  <rect class="thread" x="45" y="95" width="250" height="180" rx="18"/><text class="h" x="85" y="135">worker Thread</text><text class="p" x="75" y="173">long-lived pool worker</text><text class="p" x="75" y="205">owns execution state</text><text class="p" x="75" y="237">Thread object lives on heap</text>
  <rect class="map" x="390" y="80" width="320" height="440" rx="18"/><text class="h" x="455" y="120">ThreadLocalMap</text><text class="p" x="432" y="150">one map associated with Thread</text>
  <rect class="box" x="425" y="185" width="250" height="120" rx="12"/><text class="h" x="455" y="220">Entry A</text><text class="p" x="455" y="252">weak key → CONTEXT</text><text class="p" x="455" y="280">strong value → RequestContext</text>
  <rect class="warn" x="425" y="340" width="250" height="135" rx="12"/><text class="h" x="455" y="375">Stale entry</text><text class="p" x="455" y="408">weak key → null</text><text class="p" x="455" y="437">strong value still present</text><text class="small" x="455" y="462">until cleanup/remove/map activity</text>
  <rect class="box" x="800" y="95" width="320" height="100" rx="15"/><text class="h" x="840" y="133">ThreadLocal key</text><text class="p" x="840" y="165">static CONTEXT object</text>
  <rect class="value" x="800" y="240" width="320" height="115" rx="15"/><text class="h" x="840" y="279">RequestContext value</text><text class="p" x="840" y="310">ordinary heap object</text><text class="p" x="840" y="336">logically visible to one thread</text>
  <rect class="warn" x="800" y="410" width="320" height="145" rx="15"/><text class="h" x="840" y="449">Retention hazard</text><text class="p" x="840" y="483">pool thread remains alive</text><text class="p" x="840" y="512">→ map remains reachable</text><text class="p" x="840" y="541">→ value remains reachable</text>
  <path class="arrow" d="M295 180H390"/><text class="small" x="300" y="164">strong</text><path class="arrow weak" d="M675 235C745 235 750 145 800 145"/><text class="small" x="700" y="210">weak key</text><path class="arrow" d="M675 275C735 275 745 295 800 295"/><text class="small" x="704" y="294">strong value</text><path class="arrow" d="M675 410C735 410 740 470 800 470"/>
  <rect class="value" x="45" y="380" width="250" height="140" rx="16"/><text class="h" x="78" y="420">Safe request scope</text><text class="p" x="78" y="453">set before work</text><text class="p" x="78" y="481">remove in finally</text><text class="p" x="78" y="509">never assume pool ends</text>
  <text class="p" x="45" y="605">ThreadLocal is not a stack slot, TLAB, CPU cache, or cross-thread publication mechanism.</text>
</svg>

<text x="40" y="99" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#20334B">A service can be an inbound resource server and an outbound OAuth client; provider tokens are separate from customer tokens</text>

<text x="1275.0" y="1398.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Manhattan / ValueChain / Estafeta flags</text>
<text x="1275.0" y="1425.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Auth can be delegated to the egress path</text>
<rect x="1870" y="1320" width="570" height="140" rx="12" fill="#FFF1DF" stroke="#BE9253" />
<text x="2155.0" y="1385.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#20334B">Inventory / Delivery / Shipping rules</text>
<text x="2155.0" y="1412.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Manhattan / Providers / Apigee route</text>
<rect x="80" y="1630" width="2360" height="115" rx="12" fill="#F4F6F8" stroke="#A4ADB9" />
<text x="1260.0" y="1682.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#20334B">Apigee is referenced by an outbound shipping-restriction integration; it is not established as the primary inbound gateway.</text>
<text x="1260.0" y="1709.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Identity TTL/refresh, channel adapters, and external provider implementations remain outside the inspected scope.</text>

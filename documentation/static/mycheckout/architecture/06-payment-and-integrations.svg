<text x="1260.0" y="722.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#20334B">Synchronous checkout also calls the payment domain. A timeout is an unknown outcome, not proof of payment failure.</text>
<text x="1260.0" y="749.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Reservation/payment ordering and compensation vary by market, flow and feature flags.</text>

<text x="380.0" y="1113.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Select configured integration client</text>
<text x="380.0" y="1140.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#20334B">Do not reuse customer token by assumption</text>

server {
  listen 8080;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /shopverse/;
  }

  # Docusaurus publishes under /shopverse/ while the image stores build/ at root.
  location /shopverse/ {
    rewrite ^/shopverse/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

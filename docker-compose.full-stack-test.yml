# Isolated frontend overlay for full-stack verification.
#
# Intended for infra/scripts/Test-ShopverseFullStack.ps1, not daily development.

services:
  minio:
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    mem_limit: 256m

  minio-init:
    container_name: ${COMPOSE_PROJECT_NAME}-minio-init
    mem_limit: 128m

  shopverse-web:
    container_name: ${COMPOSE_PROJECT_NAME}-shopverse-web
    ports: !override
      - "${SHOPVERSE_WEB_TEST_PORT:-14200}:8080"

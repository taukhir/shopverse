<app-admin-header (signOut)="logout()" />
<main class="admin-page-shell admin-settings">

  <div class="heading">
    <div>
      <p class="eyebrow">SETTINGS</p>
      <h1>Platform configuration.</h1>
    </div>
  </div>

  <section class="simulation">
    <div>
      <p>STUB SIMULATION</p>
      <h2>Control the next payment outcome.</h2>
      <span>This affects the payment provider stub used by the demo workflow.</span>
    </div>
    <form (ngSubmit)="setSimulationMode()">
      <select name="simulationMode" [(ngModel)]="simulationMode">
        @for (mode of modes; track mode) {
          <option [value]="mode">{{ mode }}</option>
        }
      </select>
      <button [disabled]="simulationSaving()">{{ simulationSaving() ? 'Saving...' : 'Apply mode' }}</button>
    </form>
  </section>
</main>

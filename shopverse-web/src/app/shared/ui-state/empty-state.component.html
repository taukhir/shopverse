<section class="empty-state" aria-labelledby="empty-state-title">
  <p>{{ eyebrow() }}</p>
  <h2 id="empty-state-title">{{ title() }}</h2>
  @if (message()) {
    <span>{{ message() }}</span>
  }
  @if (actionLabel() && actionLink()) {
    <a [routerLink]="actionLink()">{{ actionLabel() }} <b>&rarr;</b></a>
  }
</section>

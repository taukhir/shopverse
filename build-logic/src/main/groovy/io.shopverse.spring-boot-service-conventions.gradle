plugins {
    id 'io.shopverse.java-service-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

def sharedVersions = new Properties()
new File(rootDir, '../../gradle/libs.versions.toml').withReader { reader ->
    reader.eachLine { line ->
        def match = line =~ /^(\w+)\s*=\s*"([^"]+)"/
        if (match) {
            sharedVersions.setProperty(match.group(1), match.group(2))
        }
    }
}

ext.set('springCloudVersion', sharedVersions.getProperty('springCloud'))
ext.set('resilience4jVersion', '2.4.0')
ext.set('testcontainersVersion', '2.0.5')

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

project.apply from: new File(rootDir, '../../gradle/security-dependencies.gradle')

tasks.named('jar') {
    enabled = false
}

databaseChangeLog:
  - changeSet:
      id: 019-create-user-groups
      author: shopverse
      changes:
        - createTable:
            tableName: user_groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: version
                  type: BIGINT
        - createTable:
            tableName: user_group_members
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_group_members
            columnNames: user_id, group_id
            constraintName: pk_user_group_members
        - addForeignKeyConstraint:
            baseTableName: user_group_members
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_group_members_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_group_members
            baseColumnNames: group_id
            referencedTableName: user_groups
            referencedColumnNames: id
            constraintName: fk_user_group_members_group
            onDelete: CASCADE
        - createTable:
            tableName: user_group_roles
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_group_roles
            columnNames: group_id, role_id
            constraintName: pk_user_group_roles
        - addForeignKeyConstraint:
            baseTableName: user_group_roles
            baseColumnNames: group_id
            referencedTableName: user_groups
            referencedColumnNames: id
            constraintName: fk_user_group_roles_group
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_group_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_group_roles_role
            onDelete: CASCADE

databaseChangeLog:
  - changeSet:
      id: 020-add-refresh-token-audit-columns
      author: shopverse
      changes:
        - addColumn:
            tableName: refresh_tokens
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0

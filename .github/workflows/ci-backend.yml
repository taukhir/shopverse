name: ShopVerse / CI / Backend

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  validate-config:
    name: Validate repository config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify pipeline logic and workflow contracts
        run: |
          node --test .github/ci/*.test.mjs
          node .github/ci/lint-workflows.mjs

      - name: Validate required files and Compose model
        shell: bash
        env:
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
          MINIO_ROOT_USER: test-minio-user
          MINIO_ROOT_PASSWORD: test-minio-password
          GRAFANA_ADMIN_PASSWORD: test-grafana-password
          COMPOSE_PROJECT_NAME: shopverse-ci-validation
        run: |
          set -euo pipefail

          required_files=(
            "docker-compose.yml"
            "docker-compose.test.yml"
            "infra/cloud-configs/application.yml"
            "infra/cloud-configs/API-GATEWAY.yml"
            "infra/cloud-configs/AUTH-SERVICE.yml"
            "infra/cloud-configs/USER-SERVICE.yml"
            "infra/cloud-configs/ORDER-SERVICE.yml"
            "infra/cloud-configs/PAYMENT-SERVICE.yml"
            "infra/cloud-configs/INVENTORY-SERVICE.yml"
            "infra/cloud-configs/DISCOVERY-SERVER.yml"
            "infra/observability/prometheus-docker.yml"
            "infra/observability/promtail.yml"
            "infra/observability/loki.yml"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

  detect-changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      integration_matrix: ${{ steps.detect.outputs.integration_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      has_integration_changes: ${{ steps.detect.outputs.has_integration_changes }}
      common_required: ${{ steps.detect.outputs.common_required }}
      smoke_required: ${{ steps.detect.outputs.smoke_required }}
      release_candidate: ${{ steps.detect.outputs.release_candidate }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build service matrices
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci/pipeline.mjs detect

  test-unit:
    name: Unit Tests / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-config
      - detect-changes
    if: needs['detect-changes'].outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs['detect-changes'].outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run unit tests and static analysis
        timeout-minutes: 15
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-daemon --no-configuration-cache --max-workers=2 -I ../../.github/ci/enforce-quality.gradle

      - name: Upload failed verification reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-report-${{ matrix.service }}
          path: ${{ matrix.path }}/build/reports/
          retention-days: 14
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - validate-config
      - detect-changes
    if: needs['detect-changes'].outputs.has_integration_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs['detect-changes'].outputs.integration_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run Testcontainers integration tests
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew integrationTest --no-daemon --no-configuration-cache --max-workers=2

      - name: Upload failed integration reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-integration-report-${{ matrix.service }}
          path: ${{ matrix.path }}/build/reports/tests/integrationTest
          retention-days: 14
          if-no-files-found: ignore

  build-images:
    name: Container Build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - detect-changes
      - test-unit
      - test-integration
      - security
    if: |
      always() &&
      needs['detect-changes'].outputs.has_changes == 'true' &&
      needs['test-unit'].result == 'success' &&
      needs.security.result == 'success' &&
      (needs['test-integration'].result == 'success' || needs['test-integration'].result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs['detect-changes'].outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image with layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: shopverse/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: shopverse/${{ matrix.service }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          scanners: vuln
          exit-code: "1"

      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-scan-${{ matrix.service }}-${{ github.run_attempt }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Export verified candidate and SBOM
        if: needs['detect-changes'].outputs.smoke_required == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          docker save "shopverse/${SERVICE}:ci-${GITHUB_SHA}" --output candidate/image.tar
          (cd candidate && sha256sum image.tar > image.tar.sha256)
          node .github/ci/pipeline.mjs candidate
          trivy image --format cyclonedx --output candidate/sbom.cdx.json "shopverse/${SERVICE}:ci-${GITHUB_SHA}"

      - name: Retain verified candidate
        if: needs['detect-changes'].outputs.smoke_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ matrix.service }}
          path: candidate/
          compression-level: 0
          retention-days: ${{ needs['detect-changes'].outputs.release_candidate == 'true' && 7 || 1 }}
          if-no-files-found: error

  test-checkout-saga:
    name: Checkout SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-config
      - detect-changes
      - test-unit
      - test-integration
      - build-images
    if: |
      always() &&
      needs['detect-changes'].outputs.smoke_required == 'true' &&
      needs.validate-config.result == 'success' &&
      (needs['test-unit'].result == 'success' || needs['test-unit'].result == 'skipped') &&
      (needs['test-integration'].result == 'success' || needs['test-integration'].result == 'skipped') &&
      needs['build-images'].result == 'success'
    env:
      MYSQL_PASSWORD: shopverse-test-password
      MYSQL_ROOT_PASSWORD: shopverse-test-root-password
      MINIO_ROOT_USER: shopverse-test-minio
      MINIO_ROOT_PASSWORD: shopverse-test-minio-password
      GRAFANA_ADMIN_PASSWORD: shopverse-test-grafana-password
      COMPOSE_PROJECT_NAME: shopverse-ci-smoke
      COMPOSE_PARALLEL_LIMIT: "2"
      COMPOSE_BAKE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified candidate images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: candidate-*
          path: candidates

      - name: Load the images built and scanned by CI
        run: |
          set -euo pipefail
          for candidate in candidates/*; do
            (cd "$candidate" && sha256sum --check image.tar.sha256)
            docker load --input "$candidate/image.tar"
            rm -- "$candidate/image.tar"
          done
          node .github/ci/pipeline.mjs compose-candidates

      - name: Start lightweight stack
        shell: bash
        run: |
          set -o pipefail
          if ! docker compose \
              -f docker-compose.yml \
              -f docker-compose.test.yml -f candidate-images.json \
              up -d --no-build \
              mysql mysql-bootstrap kafka config-server discovery-server \
              user-service auth-service order-service payment-service \
              inventory-service api-gateway; then
            docker compose -f docker-compose.yml -f docker-compose.test.yml ps
            docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=160 mysql mysql-bootstrap
            exit 1
          fi

      - name: Wait for API Gateway
        shell: pwsh
        run: ./infra/scripts/Wait-Service.ps1 -Uri http://localhost:18080/actuator/health -TimeoutSeconds 180

      - name: Run authenticated SAGA smoke test
        shell: pwsh
        run: ./infra/scripts/Smoke-Test.ps1 -GatewayUrl http://localhost:18080 -TimeoutSeconds 45

      - name: Dump bounded diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=120

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans --timeout 10

  test-common:
    name: Shared Module Checks
    needs: [validate-config, detect-changes]
    if: needs['detect-changes'].outputs.common_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Check shared modules
        working-directory: shopverse-common
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-daemon --no-configuration-cache --max-workers=2 -I ../.github/ci/enforce-quality.gradle
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shared-module-reports
          path: shopverse-common/**/build/reports/
          retention-days: 14

  security:
    name: Security
    uses: ./.github/workflows/ci-security.yml
    permissions:
      contents: read
      security-events: write
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  ci-gate:
    name: Backend CI Gate
    if: always()
    needs: [validate-config, detect-changes, test-common, test-unit, test-integration, security, build-images, test-checkout-saga]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require all selected checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/pipeline.mjs gate

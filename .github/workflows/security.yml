name: Shopverse Security

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 21:00 UTC (02:30 Asia/Kolkata)
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: shopverse-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - api-gateway
          - auth-service
          - config-server
          - discovery-server
          - inventory-service
          - order-service
          - payment-service
          - user-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: shopverse/${{ matrix.service }}:security-scan
          # Same cache scope as ci.yml's Docker build job, so this reuses
          # the layers CI already built instead of rebuilding from scratch.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shopverse/${{ matrix.service }}:security-scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

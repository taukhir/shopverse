name: Shopverse Security

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 21:00 UTC (02:30 Asia/Kolkata)
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: shopverse-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

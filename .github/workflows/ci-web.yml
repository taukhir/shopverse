name: ShopVerse / CI / Web

on:
  push:
    branches:
      - master
    paths:
      - "shopverse-web/**"
  pull_request:
    paths:
      - "shopverse-web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web Verification
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shopverse-web/package-lock.json

      - name: Run frontend site automation
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\infra\scripts\Test-ShopverseSites.ps1
          -Target Web
          -Mode Quick
          -TimeoutMinutes 30
          -Install

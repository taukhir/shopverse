name: Commit Message Format

on:
  pull_request:
    branches:
      - "**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Commit Message Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node .github/ci/check-commit-messages.mjs

      - name: Validate merge group commits
        if: github.event_name == 'merge_group'
        env:
          COMMIT_RANGE: ${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}
        run: node .github/ci/check-commit-messages.mjs

      - name: Validate manually selected commit range
        if: github.event_name == 'workflow_dispatch'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Workflow dispatch has no prior SHA; provide a PR check for commit validation."
            exit 1
          fi
          node .github/ci/check-commit-messages.mjs

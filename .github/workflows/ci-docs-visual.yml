name: ShopVerse / CI / Docs Visual

on:
  pull_request:
    paths:
      - "documentation/src/**"
      - "documentation/static/**"
      - "documentation/docusaurus.config.ts"
      - "documentation/playwright.config.ts"
      - "documentation/package.json"
      - "documentation/package-lock.json"
      - "documentation/scripts/run-visual-tests.mjs"
      - "documentation/tests/visual-regression.spec.ts"
      - ".github/workflows/ci-docs-visual.yml"
  push:
    branches:
      - master
    paths:
      - "documentation/src/**"
      - "documentation/static/**"
      - "documentation/docusaurus.config.ts"
      - "documentation/playwright.config.ts"
      - "documentation/package.json"
      - "documentation/package-lock.json"
      - "documentation/scripts/run-visual-tests.mjs"
      - "documentation/tests/visual-regression.spec.ts"
      - ".github/workflows/ci-docs-visual.yml"
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate new Linux Chromium baselines
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Documentation Visual Regression
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    env:
      VISUAL_REGRESSION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare or update Linux baselines
        run: npm run test:visual -- ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines && '--update-snapshots' || '' }}
      - name: Upload baseline or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-linux-visuals
          path: |
            documentation/tests/**/*-snapshots/**
            documentation/test-results/**

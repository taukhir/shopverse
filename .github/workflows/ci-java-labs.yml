name: ShopVerse / CI / Java Labs

on:
  pull_request:
    paths:
      - 'documentation/labs/java-senior/**'
      - '.github/workflows/ci-java-labs.yml'
  push:
    branches: [master]
    paths:
      - 'documentation/labs/java-senior/**'
      - '.github/workflows/ci-java-labs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java Labs / JDK ${{ matrix.java }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['24', '25']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation/labs/java-senior
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode -Dmaven.compiler.release=${{ matrix.java }} test
      - name: Package benchmark and stress sources
        run: mvn --batch-mode -Dmaven.compiler.release=${{ matrix.java }} -DskipTests package

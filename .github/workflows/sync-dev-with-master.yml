name: ShopVerse / Integration / Dev Sync

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shopverse-sync-dev
  cancel-in-progress: false

jobs:
  sync-dev:
    name: Merge master into dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Fast-forward or merge master into dev
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "dev already contains origin/master; nothing to do."
            exit 0
          fi

          if ! git merge --no-edit origin/master; then
            echo "Merge conflict syncing master into dev; resolve manually." >&2
            git merge --abort
            exit 1
          fi

          git push origin dev

version: 2
updates:
  # GitHub Actions used in CI/deploy workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Gradle: build-logic (convention plugins)
  - package-ecosystem: "gradle"
    directory: "/build-logic"
    schedule:
      interval: "weekly"

  # Gradle: shared starter modules
  - package-ecosystem: "gradle"
    directory: "/shopverse-common"
    schedule:
      interval: "weekly"

  # Gradle: the 8 services
  - package-ecosystem: "gradle"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/config-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/discovery-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/inventory-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/payment-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"

  # npm: frontend and documentation site
  - package-ecosystem: "npm"
    directory: "/shopverse-web"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      # Angular 22.x pins its compiler-cli peer dependency to
      # "typescript >=6.0 <6.1"; a TypeScript major bump isn't installable
      # until Angular's own TypeScript support moves forward.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
    ignore:
      # @docusaurus/theme-mermaid@3.10.2 peer-requires
      # "@mermaid-js/layout-elk ^0.1.9"; a major bump isn't installable
      # until the Docusaurus theme supports the 1.x line.
      - dependency-name: "@mermaid-js/layout-elk"
        update-types: ["version-update:semver-major"]

  # Docker base images used in each service's Dockerfile
  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/config-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/discovery-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/inventory-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/payment-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/dev-tools/jenkins"
    schedule:
      interval: "weekly"

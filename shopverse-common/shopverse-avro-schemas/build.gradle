plugins {
    id 'com.bakdata.avro' version '2.0.1'
}

description = 'Service-owned Avro event schemas and generated SpecificRecord types.'

dependencies {
    api 'org.apache.avro:avro:1.12.2'
}

// com.bakdata.avro adds one of these per source set (main: configureCopy...,
// test: configureCopyTest...) -- match on the common suffix so both are
// covered, not just the main-sourceSet task name.
tasks.matching { it.name.endsWith('ExternalAvroResources') }.configureEach {
    notCompatibleWithConfigurationCache(
        "com.bakdata.avro's ${name} task is not yet compatible with Gradle's configuration cache"
    )
}

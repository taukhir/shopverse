pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'shopverse-platform'

include 'shopverse-common-error'
include 'shopverse-pagination-starter'
include 'shopverse-observability-starter'
include 'shopverse-security-starter'
include 'shopverse-kafka-starter'
include 'shopverse-outbox-starter'
include 'shopverse-kafka-recovery-starter'

include 'shopverse-contracts'

// shopverse-avro-schemas is in-progress work, not yet committed. Include it
// only when the directory actually exists, so CI (which checks out only
// committed content) doesn't break while this module is still WIP.
if (file('shopverse-avro-schemas').exists()) {
    include 'shopverse-avro-schemas'
}

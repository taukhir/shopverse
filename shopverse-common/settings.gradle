pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'shopverse-platform'

include 'shopverse-common-error'
include 'shopverse-pagination-starter'
include 'shopverse-contracts'
include 'shopverse-observability-starter'
include 'shopverse-security-starter'
include 'shopverse-kafka-starter'
include 'shopverse-outbox-starter'
include 'shopverse-kafka-recovery-starter'
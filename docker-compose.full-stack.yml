# Full-stack overlay for the ShopVerse UI.
#
# Usage:
#   docker compose --profile apps --profile assets -f docker-compose.yml -f docker-compose.full-stack.yml up --build
#
# URLs:
#   Storefront:     http://localhost:4200
#   API Gateway:    http://localhost:8080
#
# The documentation site moved to its own repository, taukhir/shopverse-docs,
# and is no longer part of this overlay. Run it from that repository's own
# Dockerfile/compose setup, or use its published GitHub Pages site.

services:
  shopverse-web:
    build:
      context: ./shopverse-web
      dockerfile: Dockerfile
    image: shopverse/shopverse-web:local
    container_name: shopverse-web
    ports:
      - "${SHOPVERSE_WEB_PORT:-4200}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - shopverse
